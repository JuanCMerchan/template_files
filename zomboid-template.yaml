name: zomboid-server
services:
  zomboid-server:
    image: indifferentbroccoli/projectzomboid-server-docker:latest
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "${QUERY_PORT_1}:${QUERY_PORT_1}/udp"
      - "${QUERY_PORT_2}:${QUERY_PORT_2}/udp"
    environment:
      PUID: 1000
      PGID: 1000
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      SERVER_NAME: "${SERVER_NAME}"
      DEFAULT_PORT: "${QUERY_PORT_1}"
      UDP_PORT: "${QUERY_PORT_2}"
      MAX_PLAYERS: "${MAX_PLAYERS}"
      MEMORY_XMX_GB: "8"
      UPDATE_ON_START: "true"
      SERVER_BRANCH: "${GAME_VERSION}"
      STEAM_VAC: "false"
      USE_STEAM: "true"
    volumes:
      - type: volume
        source: zomboid-server-files
        target: /project-zomboid
      - type: volume
        source: zomboid-config
        target: /project-zomboid-config

volumes:
  zomboid-server-files:
    name: "${VOLUME_NAME}-server-files"
  zomboid-config:
    name: "${VOLUME_NAME}-config"
